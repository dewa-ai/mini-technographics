# Technology signatures. Every rule is a case-insensitive regex.
#   headers:        header name -> regex on its value ("" = header is present)
#   cookies:        cookie name regex, matched against Set-Cookie
#   meta_generator: regex on <meta name="generator" content="...">
#   html:           regexes searched in the raw HTML

# --- CDN and hosting ---
- name: Cloudflare
  category: CDN
  headers: {cf-ray: "", server: '^cloudflare'}
- name: Amazon CloudFront
  category: CDN
  headers: {x-amz-cf-id: "", via: 'cloudfront'}
- name: Fastly
  category: CDN
  headers: {x-fastly-request-id: "", x-served-by: '^cache-'}
- name: Akamai
  category: CDN
  headers: {server: 'akamai', x-akamai-transformed: ""}
- name: Vercel
  category: Hosting
  headers: {x-vercel-id: "", server: '^vercel'}
- name: Netlify
  category: Hosting
  headers: {x-nf-request-id: "", server: '^netlify'}

# --- Web servers ---
- name: Nginx
  category: Web server
  headers: {server: '^nginx'}
- name: Apache HTTP Server
  category: Web server
  headers: {server: '^apache'}
- name: Microsoft IIS
  category: Web server
  headers: {server: 'microsoft-iis'}
- name: LiteSpeed
  category: Web server
  headers: {server: 'litespeed'}
- name: OpenResty
  category: Web server
  headers: {server: '^openresty'}

# --- Languages and backend frameworks ---
- name: PHP
  category: Programming language
  headers: {x-powered-by: 'php'}
  cookies: [PHPSESSID]
- name: ASP.NET
  category: Web framework
  headers: {x-powered-by: 'asp\.net', x-aspnet-version: ""}
  cookies: ['ASP\.NET_SessionId']
- name: Express
  category: Web framework
  headers: {x-powered-by: '^express'}
- name: Java
  category: Programming language
  cookies: [JSESSIONID]

# --- CMS and website builders ---
- name: WordPress
  category: CMS
  meta_generator: '^wordpress'
  html: ['/wp-content/', '/wp-includes/']
  implies: [PHP]
- name: Drupal
  category: CMS
  headers: {x-drupal-cache: "", x-generator: 'drupal'}
  meta_generator: '^drupal'
  html: ['drupal-settings-json']
  implies: [PHP]
- name: Joomla
  category: CMS
  meta_generator: '^joomla'
  implies: [PHP]
- name: Ghost
  category: CMS
  meta_generator: '^ghost'
- name: Wix
  category: Website builder
  headers: {x-wix-request-id: ""}
  html: ['static\.wixstatic\.com']
- name: Squarespace
  category: Website builder
  html: ['static1\.squarespace\.com']
- name: Webflow
  category: Website builder
  html: ['data-wf-site=', 'data-wf-page=']

# --- Ecommerce ---
- name: Shopify
  category: Ecommerce
  headers: {x-shopid: "", x-shopify-stage: ""}
  html: ['cdn\.shopify\.com']
- name: WooCommerce
  category: Ecommerce
  html: ['/wp-content/plugins/woocommerce/']
  implies: [WordPress]
- name: Magento
  category: Ecommerce
  html: ['mage/cookies', 'Magento_']
  implies: [PHP]
- name: BigCommerce
  category: Ecommerce
  html: ['cdn\d*\.bigcommerce\.com']

# --- JavaScript frameworks and libraries ---
- name: Next.js
  category: JavaScript framework
  headers: {x-powered-by: 'next\.js'}
  html: ['__NEXT_DATA__', '/_next/static/']
  implies: [React]
- name: Nuxt.js
  category: JavaScript framework
  html: ['window\.__NUXT__', '/_nuxt/']
  implies: [Vue.js]
- name: React
  category: JavaScript framework
  html: ['data-reactroot', 'react-dom(\.production)?(\.min)?\.js']
- name: Vue.js
  category: JavaScript framework
  html: ['data-v-[0-9a-f]{8}', 'vue(\.runtime)?(\.global)?(\.prod)?(\.min)?\.js']
- name: Angular
  category: JavaScript framework
  html: ['ng-version=']
- name: Gatsby
  category: Static site generator
  html: ['id="___gatsby"']
  implies: [React]
- name: jQuery
  category: JavaScript library
  html: ['jquery[.-]?[0-9.]*(\.min)?\.js']
- name: Bootstrap
  category: UI framework
  html: ['bootstrap(\.bundle)?(\.min)?\.(css|js)']

# --- Analytics and tag management ---
- name: Google Analytics
  category: Analytics
  html: ['google-analytics\.com/(analytics|ga)\.js', 'googletagmanager\.com/gtag/js\?id=(G|UA)-']
- name: Google Tag Manager
  category: Tag manager
  html: ['googletagmanager\.com/gtm\.js', 'googletagmanager\.com/ns\.html']
- name: Adobe Experience Platform Tags
  category: Tag manager
  html: ['assets\.adobedtm\.com']
- name: Hotjar
  category: Analytics
  html: ['static\.hotjar\.com']
- name: Microsoft Clarity
  category: Analytics
  html: ['clarity\.ms/tag']
- name: Segment
  category: Customer data platform
  html: ['cdn\.segment\.com']
- name: Mixpanel
  category: Analytics
  html: ['cdn\.mxpnl\.com']

# --- Advertising ---
- name: Meta Pixel
  category: Advertising
  html: ['connect\.facebook\.net/[a-z_]+/fbevents\.js']
- name: Google AdSense
  category: Advertising
  html: ['pagead2\.googlesyndication\.com']

# --- Marketing and customer support ---
- name: HubSpot
  category: Marketing automation
  html: ['js\.hs-scripts\.com', 'js\.hsforms\.net']
- name: Intercom
  category: Live chat
  html: ['widget\.intercom\.io', 'js\.intercomcdn\.com']
- name: Zendesk
  category: Live chat
  html: ['static\.zdassets\.com']
- name: Drift
  category: Live chat
  html: ['js\.driftt\.com']

# --- Payments ---
- name: Stripe
  category: Payments
  html: ['js\.stripe\.com']
- name: PayPal
  category: Payments
  html: ['paypal\.com/sdk/js', 'paypalobjects\.com']

# --- Security and privacy ---
- name: Google reCAPTCHA
  category: Security
  html: ['google\.com/recaptcha/', 'recaptcha/api\.js']
- name: hCaptcha
  category: Security
  html: ['js\.hcaptcha\.com', 'hcaptcha\.com/1/api\.js']
- name: Cloudflare Turnstile
  category: Security
  html: ['challenges\.cloudflare\.com/turnstile']
- name: OneTrust
  category: Cookie consent
  html: ['cdn\.cookielaw\.org', 'optanon']
- name: Cookiebot
  category: Cookie consent
  html: ['consent\.cookiebot\.com']

# --- Fonts ---
- name: Google Fonts
  category: Font service
  html: ['fonts\.googleapis\.com']
- name: Font Awesome
  category: Font service
  html: ['font-?awesome']
